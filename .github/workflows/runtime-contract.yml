name: Runtime contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Repository contracts
        run: python -m unittest runtime/tests/test_runtime_contract.py
      - name: Shell syntax
        run: |
          find . -path './.git' -prune -o -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n
      - name: Python syntax
        run: python -m compileall -q runtime scripts vllm_patch_gb10
      - name: Private-data guard
        run: runtime/scripts/check-private-data.sh
      - name: vLLM source and patch contract
        run: runtime/scripts/prepare-source.sh
