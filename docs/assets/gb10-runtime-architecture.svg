<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek V4 Flash GB10 two-node serving architecture</title>
  <desc id="desc">Operator control plane, pinned runtime build, two DGX Spark nodes, and OpenAI-compatible API.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
    .header { fill: #0f766e; }
    .runtime { fill: #155e75; }
    .accent { fill: #f59e0b; }
    .soft { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
    .text { fill: #0f172a; font: 500 18px Arial, sans-serif; }
    .small { fill: #334155; font: 500 15px Arial, sans-serif; }
    .label { fill: #ffffff; font: 700 18px Arial, sans-serif; }
    .title { fill: #0f172a; font: 700 29px Arial, sans-serif; }
    .line { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .dash { stroke: #0f766e; stroke-width: 3; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow-teal); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#475569"/></marker>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#0f766e"/></marker>
  </defs>
  <rect class="bg" width="1200" height="620"/>
  <text x="60" y="55" class="title">DeepSeek V4 Flash GB10 Serving Lane</text>
  <text x="60" y="84" class="small">rc7 · TP=2 · DSpark K=5 · thinking=max · fp8_ds_mla · dual-HCA QSFP merge</text>

