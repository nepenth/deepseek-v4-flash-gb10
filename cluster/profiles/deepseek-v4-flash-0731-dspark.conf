# DeepSeek V4 Flash 0731 Stage-C production rollback profile

PROFILE_DESCRIPTION="Current Stage-C production service on the 2x DGX Spark cluster"
SERVICE_MODE=scripted
MODEL_PATH=/opt/models/deepseek-ai--DeepSeek-V4-Flash-0731
WORKER_MODEL_PATH=/opt/models/deepseek-ai--DeepSeek-V4-Flash-0731
MODEL_NAME="deepseek-ai/DeepSeek-V4-Flash-0731 deepseek-v4-flash-0731"
DOCKER_IMAGE=vllm-dspark-runtime:dspark-nvfp4-stage-c
SERVICE_HOME="${VLLM_SWITCH_SERVICE_HOME:-$HOME}"
WORKING_DIRECTORY="$SERVICE_HOME/vllm-models"
RESTART_POLICY=on-failure
STARTUP_TIMEOUT=1500
STOP_TIMEOUT=120

# The profile runner executes pre-start exactly once. The previous unit had the
# same command in both the base unit and a drop-in.
PRE_START_COMMAND=/usr/local/bin/vllm-pre-start.sh
START_COMMAND="$SERVICE_HOME/vllm-models/dsv4-0731-cluster-start.sh"
TRACK_COMMAND="exec docker wait vllm_ds4_0731"
STOP_COMMAND="$SERVICE_HOME/vllm-models/dsv4-0731-cluster-stop.sh"
READINESS_URL=http://127.0.0.1:8000/v1/models
READINESS_MODEL=deepseek-v4-flash-0731

SERVICE_ENV=(
  "HOME=$SERVICE_HOME"
  "MAX_LEN=393216"
  "MAX_SEQS=6"
  "BATCHED=4096"
  "GMU=0.78"
  "K=5"
  "IMAGE=vllm-dspark-runtime:dspark-nvfp4-stage-c"
  "MODEL_PATH=/opt/models/deepseek-ai--DeepSeek-V4-Flash-0731"
  "NAME=vllm_ds4_0731"
)

REQUIRED_LOCAL_PATHS=(
  /usr/local/bin/vllm-pre-start.sh
  "$SERVICE_HOME/vllm-models/dsv4-0731-cluster-start.sh"
  "$SERVICE_HOME/vllm-models/dsv4-0731-cluster-stop.sh"
  "$SERVICE_HOME/vllm-models/dsv4-0731-launch.sh"
  "$SERVICE_HOME/vllm-models/dsv4-0731-inner-serve.sh"
)
REQUIRED_WORKER_PATHS=(
  "$SERVICE_HOME/vllm-models/dsv4-0731-inner-serve.sh"
)

ADOPT_UNIT_CONTAINS=(
  "$SERVICE_HOME/vllm-models/dsv4-0731-cluster-start.sh"
  vllm_ds4_0731
)
