# DeepSeek V4 Flash 0731 vLLM 0.27.1 GB10 first-light canary

PROFILE_DESCRIPTION="vLLM 0.27.1 GB10 candidate at the current 393K production envelope"
SERVICE_MODE=scripted
MODEL_PATH=/opt/models/deepseek-ai--DeepSeek-V4-Flash-0731
WORKER_MODEL_PATH=/opt/models/deepseek-ai--DeepSeek-V4-Flash-0731
MODEL_ARGUMENT=/models/dspark-checkpoint
MODEL_NAME=deepseek-v4-flash-0731-v0271-canary
DOCKER_IMAGE=dspark-vllm-gb10:v0.27.1-gb10-rc2
SERVICE_HOME="${VLLM_SWITCH_SERVICE_HOME:-$HOME}"
WORKING_DIRECTORY="$SERVICE_HOME/vllm-v0271-gb10"
RESTART_POLICY=no
STARTUP_TIMEOUT=1800
STOP_TIMEOUT=180
ROLLBACK_PROFILE=deepseek-v4-flash-0731-dspark
AUTO_ROLLBACK=1

START_COMMAND="./start-deepseek-v4-flash-dspark.sh"
TRACK_COMMAND="exec docker wait dsv4-v0271-canary-vllm-dspark-1"
STOP_COMMAND="./stop-deepseek-v4-flash-dspark.sh"
READINESS_URL=http://127.0.0.1:8000/v1/models
READINESS_MODEL=deepseek-v4-flash-0731-v0271-canary
CAPTURE_FAILURE_COMMAND="$SERVICE_HOME/vllm-v0271-gb10/cluster/scripts/capture-cluster-state.sh --label canary-failure"

SERVICE_ENV=(
  "HOME=$SERVICE_HOME"
  "ENV_FILE=$SERVICE_HOME/vllm-v0271-gb10/cluster/environments/deepseek-v4-flash-0731-v0271-canary.env"
  "COMPOSE_FILE=$SERVICE_HOME/vllm-v0271-gb10/docker-compose.dspark.yml"
  "PROJECT_NAME=dsv4-v0271-canary"
  "LEGACY_PROJECT_NAME=dsv4-v0271-canary"
  "ENABLE_VL_SIDECAR=0"
  "VLLM_SWITCH_IMAGE=$DOCKER_IMAGE"
  "WAIT_ATTEMPTS=120"
  "WAIT_SECONDS=15"
)

REQUIRED_LOCAL_PATHS=(
  "$SERVICE_HOME/vllm-v0271-gb10/start-deepseek-v4-flash-dspark.sh"
  "$SERVICE_HOME/vllm-v0271-gb10/stop-deepseek-v4-flash-dspark.sh"
  "$SERVICE_HOME/vllm-v0271-gb10/docker-compose.dspark.yml"
  "$SERVICE_HOME/vllm-v0271-gb10/cluster/environments/deepseek-v4-flash-0731-v0271-canary.env"
)
REQUIRED_WORKER_PATHS=(
  "$SERVICE_HOME/vllm-v0271-gb10/docker-compose.dspark.yml"
)
